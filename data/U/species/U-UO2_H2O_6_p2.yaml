    text: Printed clearly as [UO2(H2O)6]2+; kept as printed; consistent with 'hexagonal bipyramid' and 6 waters in the drawing, though modern data give 5.
  - type: to_check
    text: 'Book gives [UO2(H2O)6]2+ (hexagonal bipyramid); modern data: [UO2(H2O)5]2+, pentagonal bipyramid. Update after digitization.'
    by: E. A. Pidko
    date: '2026-11-04'
