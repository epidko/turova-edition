id: U-UH3-x
formula: UH_{3-x}
element: U
class: hydride
kind: phase
oxidation_state: 3
names:
  en: uranium hydride (uranium trihydride)
appearance: black, brittle crystals
reactivity: electrical conductor; ignites in air; decomposed by acids; with water at 350 °C gives UO2 and H2
structure:
  description: "β-form: cubic, built from [UH4] tetrahedra and [UH12] icosahedra. Below −100 °C a cubic, ferromagnetic α-form exists. The figure 'structure of UH3' (p1A-13) shows the cubic cell with U atoms only (H not drawn)."
  crystal_system: cubic
properties:
  - property: decomposition_temperature
    value: 330
    unit: °C
    source: turova1999
  - property: enthalpy_formation
    value: -125
    unit: kJ/mol
    source: turova1999
  - property: density
    value: 10.9
    unit: g/cm3
    phase: β
    source: turova1999
  - property: bond_distance
    value: 2.32
    unit: Å
    pair: U–H
    phase: β
    source: turova1999
  - property: bond_distance
    value: 3.3
    unit: Å
    pair: U–U
    phase: β
    source: turova1999
  - property: transition_temperature
    value: <-100
    unit: °C
    conditions: β→α (α-form below −100 °C)
    source: turova1999
  - property: density
    value: 11.11
    unit: g/cm3
    phase: α
    source: turova1999
  - property: other
    value: ferromagnetic
    phase: α
    note: magnetic behaviour
    source: turova1999
notes:
